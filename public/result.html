<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>نتيجة تشخيص قرآنا · Qurana result</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#4A520A">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=El+Messiri:wght@600;700&family=Cairo:wght@400;600;700&family=Inter:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="https://quraana-institute.com" lang="ar">قرآنا</a>
  <span class="top-end"><small data-i18n="r_sub"></small><a id="lang-switch" class="lang-switch" href="#"></a></span>
</header>

<main>
  <section class="card" id="loading"><p class="muted" data-i18n="r_loading"></p></section>
  <section class="card" id="missing" hidden>
    <h2 data-i18n="r_missing"></h2>
    <p data-i18n="r_missing_text"></p>
    <a class="btn block" href="/" data-i18n="r_restart"></a>
  </section>

  <div id="result" class="stack-col" hidden>
    <section class="card" aria-labelledby="r-title">
      <span class="eyebrow" id="r-date"></span>
      <h1 id="r-title"></h1>
      <div><span class="level-badge" id="r-level"></span></div>
      <p class="level-why" id="r-why"></p>
      <p id="r-focus"></p>
      <p class="note" id="r-note"></p>
    </section>

    <section class="card" aria-labelledby="p-title">
      <h2 id="p-title" data-i18n="p_title"></h2>
      <div class="findings" id="findings" hidden>
        <h3 data-i18n="f_title"></h3>
        <p id="findings-text"></p>
      </div>
      <div id="plan" aria-live="polite"></div>
    </section>

    <section class="card" id="rep" hidden aria-labelledby="rep-title">
      <h2 id="rep-title" data-i18n="rep_title"></h2>
      <p class="small muted" data-i18n="rep_intro"></p>
      <div id="rep-body"></div>
    </section>

    <section class="card" id="obs" hidden aria-labelledby="o-title">
      <h2 id="o-title" data-i18n="obs_title"></h2>
      <div id="obs-body"></div>
    </section>

    <section class="card" aria-labelledby="d-title">
      <h2 id="d-title"></h2>
      <div class="steps-done" id="r-stages"></div>
      <div id="r-memorized"></div>
    </section>

    <section class="card" aria-labelledby="s-title">
      <h2 id="s-title"></h2>
      <div class="steps-done" id="r-suggest"></div>
    </section>

    <section class="card" aria-labelledby="n-title">
      <h2 id="n-title" data-i18n="r_next"></h2>
      <div class="ctas">
        <!-- WhatsApp first: the result reaches the institute only when the parent presses «Send» in WhatsApp. -->
        <a class="btn block" id="cta-wa" target="_blank" rel="noopener" data-i18n="cta_wa"></a>
        <p class="small muted wa-hint" data-i18n="cta_wa_hint"></p>
        <a class="btn block secondary" id="cta-book" target="_blank" rel="noopener" data-i18n="cta_book"></a>
        <a class="btn block secondary" id="cta-prices" target="_blank" rel="noopener" data-i18n="cta_prices"></a>
      </div>
      <div class="row" style="align-items:center">
        <p class="small muted" style="flex:1 1 240px"><span data-i18n="r_link"></span><br><span id="r-link" dir="ltr" style="word-break:break-all"></span></p>
        <button class="btn secondary" id="copy" type="button" data-i18n="copy"></button>
      </div>
    </section>
  </div>
</main>

<footer class="site"><p class="ai-note" data-i18n="r_ai_note"></p><p data-i18n="footer"></p></footer>

<script src="/js/i18n.js"></script>
<script src="/js/levels.js"></script>
<script src="/js/options.js"></script>
<script src="/js/skills.js"></script>
<script>
(async function () {
  const I = window.QuranaI18n, O = window.QuranaOptions, L = window.QuranaLevels;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  I.apply();
  const id = location.pathname.split("/").filter(Boolean).pop();
  let r, cfg;
  try {
    const [a, b] = await Promise.all([fetch(`/api/results/${encodeURIComponent(id)}?lang=${I.lang}`), fetch("/api/config")]);
    if (!a.ok) throw new Error();
    r = await a.json();
    cfg = await b.json();
  } catch {
    $("loading").hidden = true;
    $("missing").hidden = false;
    return;
  }
  const adult = r.who === "adult";
  // An adult's page uses the "_adult" text where there is one.
  const t = (k, v) => (adult && I.T.ar[`${k}_adult`] ? I.t(`${k}_adult`, v) : I.t(k, v));
  const lvl = adult ? L.ADULT_LEVELS[r.level.code] : L.LEVELS[r.level.code];
  const levelName = I.label(lvl, "name");
  const nick = r.profile.nickname;
  $("r-date").textContent = I.t("r_date", { date: new Date(r.created_at).toLocaleDateString(I.lang === "en" ? "en-GB" : "ar", { day: "numeric", month: "long", year: "numeric" }) });
  $("r-title").textContent = nick ? I.t("r_title_named", { name: nick }) : t("r_title");
  $("r-level").textContent = levelName;
  $("r-focus").textContent = I.t("r_focus", { focus: I.label(lvl, "focus") });
  // The level in one sentence with its reason, and «ما رصده الاختبار» above the plan (fixed rules on this result).
  $("r-why").textContent = window.QuranaSkills.levelReason(r, levelName, I.lang);
  const found = window.QuranaSkills.findings(r.stages, I.lang, adult);
  if (found) { $("findings-text").textContent = found.join(" "); $("findings").hidden = false; }
  $("r-note").textContent = t("r_note");
  document.querySelector(".ai-note").textContent = t("r_ai_note");
  $("d-title").textContent = t("r_done");
  $("s-title").textContent = t("r_suggest");

  // ---- what was done ----
  const lab = (list, v) => I.label(list.find((x) => x.id === v) || { label: v });
  if (adult) {
    $("r-stages").innerHTML = [
      [I.t("r_self"), lab(O.ADULT_SELF, r.profile.self)],
      ...(r.profile.juz ? [[I.t("r_juz"), lab(O.ADULT_JUZ, r.profile.juz)]] : []),
      // The assessment (recitation, rules, memorization); older results without it show the ayah rating instead.
      ...(r.stages && (r.stages.recite || r.stages.rules)
        ? L.ASSESS_STAGES.filter((k) => r.stages[k]).map((k) => [I.t("st_" + k), `${I.t("r_of", { a: r.stages[k].score, b: r.stages[k].total })}${r.stages[k].passed ? " ✓" : ""}`])
        : [[I.t("r_ayah"), lab(O.AYAH_SELF, r.profile.ayah) + (r.profile.ayah_ref ? ` (${r.profile.ayah_ref})` : "")]]),
    ].map(([k, v]) => `<div><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join("");
  } else {
    // Only the games the child actually played (the ones below the starting point are not listed).
    $("r-stages").innerHTML = ["check", ...L.ALL_STAGES.filter((k) => k !== "check")].filter((k) => r.stages[k] && !r.stages[k].inferred).map((k) => {
      const s = r.stages[k];
      const v = `${esc(I.t("r_of", { a: s.score, b: s.total }))} ${s.passed ? `<span class="tick">✓</span>` : ""}`;
      return `<div><span>${esc(I.t("st_" + k))}</span><span>${v}</span></div>`;
    }).join("");
    const mem = r.profile.memorized.map((ar) => (I.lang === "en" ? (O.SURAHS.find((s) => s.ar === ar) || { en: ar }).en : ar));
    $("r-memorized").innerHTML = mem.length || r.profile.memorized_more
      ? `<p class="small"><b>${esc(I.t("r_memorizes"))}</b> ${esc(mem.join(I.lang === "en" ? ", " : "، "))}${r.profile.memorized_more ? esc(I.t("r_and_more")) : ""}</p>`
      : `<p class="small muted">${esc(I.t("r_no_mem"))}</p>`;
    const memFrom = O.MEM_SOURCES.find((x) => x.id === r.profile.memorized_from);
    if (memFrom) $("r-memorized").innerHTML += `<p class="small"><b>${esc(I.t("r_mem_from"))}</b> ${esc(I.label(memFrom))}</p>`;
  }
  if (r.profile.tajweed) {
    const qLabel = (q) => (adult ? I.label(O.TAJWEED_QS_ADULT[q.id]) : I.label(q));
    $("r-memorized").innerHTML += `<p class="small"><b>${esc(t("r_tajweed"))}</b></p><div class="steps-done">` + O.TAJWEED_QS.map((q) =>
      `<div><span class="small">${esc(qLabel(q))}</span><span class="small">${esc(lab(O.TAJWEED_ANSWERS, r.profile.tajweed[q.id]))}</span></div>`).join("") + "</div>";
  }

  // ---- the skills report (a reader's assessment): mastered / needs work, with the words, recitation and memorization ----
  if (r.stages && (r.stages.recite || r.stages.rules)) {
    const SK = window.QuranaSkills;
    const D_KEY = { 1: "rep_d1", 2: "rep_d2", 3: "rep_d3" };
    const RES_KEY = { right: "rep_res_right", partial: "rep_res_partial", wrong: "rep_res_wrong" };
    const HIFZ_KEY = { right: "rep_hifz_right", partial: "rep_hifz_partial", wrong: "rep_hifz_wrong", not_memorized: "rep_hifz_not_memorized" };
    const rep = SK.report(r.stages, I.lang);
    const ln = SK.lines(rep, I.lang, adult);
    const list = (title, cls, items) => `<h3 class="rep-h ${cls}">${esc(title)}</h3>${items.length ? `<ul class="rep-list">${items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p class="small muted">${esc(I.t("rep_none"))}</p>`}`;
    const passages = rep.recite.passages.map((x) => `<li>${esc(x.ref)} · ${esc(I.t(D_KEY[x.d]))}: ${esc(I.t(RES_KEY[x.result]))}</li>`).join("");
    const hifz = rep.hifz.map((x) => `<li>${esc(x.ref)}: ${esc(I.t(HIFZ_KEY[x.result]))}</li>`).join("");
    const fallback = rep.recite.passages.length && rep.recite.passages.every((x) => x.ref.startsWith("1:"));
    $("rep-body").innerHTML =
      list(I.t("rep_mastered"), "ok", ln.mastered) +
      list(I.t("rep_needs"), "no", ln.needs) +
      (rep.unsure.length ? `<p class="small muted">${esc(I.t("rep_unsure"))}: ${esc(rep.unsure.map((x) => x.label).join(I.lang === "en" ? ", " : "، "))}</p>` : "") +
      (rep.recite.passages.length ? `<h3 class="rep-h">${esc(I.t("rep_recite"))}</h3><p class="small">${esc(rep.recite.top ? I.t("rep_recite_top", { d: I.t(D_KEY[rep.recite.top]) }) : I.t("rep_recite_none"))}</p><ul class="rep-list small">${passages}</ul>` : "") +
      (hifz ? `<h3 class="rep-h">${esc(I.t("rep_hifz"))}</h3><ul class="rep-list small">${hifz}</ul>` : "") +
      (fallback ? `<p class="small muted">${esc(I.t("rep_fallback"))}</p>` : "");
    $("rep").hidden = false;
  }

  // ---- "ما لاحظناه" (children; fixed rules from the games and the parent's answers) ----
  if (!adult && r.observed && r.observed.length) {
    $("obs-body").innerHTML = r.observed.map((x) => `<p>${esc(x)}</p>`).join("");
    $("obs").hidden = false;
  }

  // ---- suggestion ----
  const s = r.suggestion;
  const prog = (pid) => I.label(O.PROGRAMS[pid], "name");
  const progText = prog(s.program) + (s.with_tajweed ? ` ${I.t("with_tajweed")}` : s.then ? ` ${I.t("then")} ${prog(s.then)}` : "");
  const plan = O.PLANS[s.plan];
  const teacher = O.TEACHER.find((x) => x.id === r.profile.teacher);
  $("r-suggest").innerHTML = [
    [I.t("k_program"), progText],
    // The track row only while the English track exists (Qurana: Arabic track for everyone).
    ...(O.ENGLISH_TRACK ? [[I.t("k_track"), s.track === "english" ? I.t("track_en") : I.t("track_ar")]] : []),
    [I.t("k_plan"), `${I.label(plan, "name")} · ${I.t("per_week", { n: plan.per_week })}`],
    // Seed shows only as what the family chose, when they chose two lessons a week.
    ...(s.chosen === "seed" ? [[t("k_chosen"), `${I.label(O.PLANS.seed, "name")} · ${I.t("per_week", { n: O.PLANS.seed.per_week })}`]] : []),
    [I.t("k_teacher"), teacher.id === "any" ? I.t("any_teacher") : I.label(teacher)],
  ].map(([k, v]) => `<div><span class="muted">${esc(k)}</span><span>${esc(v)}</span></div>`).join("");

  const link = r.links.result;
  const waText = [
    adult ? I.t("wa_hello_adult") : nick ? I.t("wa_hello_named", { name: nick }) : I.t("wa_hello"),
    I.t("wa_level", { level: levelName }),
    I.t("wa_suggest", { program: progText, plan: I.label(plan, "name") }),
    I.t("wa_link", { link }),
    I.t("wa_book"),
  ].join("\n");
  $("cta-book").href = r.links.booking + (r.links.booking.includes("?") ? "&" : "?") + `lang=${I.lang}`;
  $("cta-wa").href = `https://wa.me/${cfg.whatsapp}?text=${encodeURIComponent(waText)}`;
  $("cta-prices").href = r.links.prices;
  $("r-link").textContent = link;
  // A localhost link only works on this computer (PUBLIC_BASE_URL not set while developing).
  if (cfg.local) $("r-link").insertAdjacentHTML("afterend", `<br><span class="draft-note">${esc(I.t("local_link"))}</span>`);
  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(link); $("copy").textContent = I.t("copied"); }
    catch { const rg = document.createRange(); rg.selectNodeContents($("r-link")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(rg); }
  });

  $("loading").hidden = true;
  $("result").hidden = false;
  document.title = I.t("r_doc_title", { level: levelName });

  // ---- learning plan ----
  // The path comes by rules in about a second and is shown at once: three time windows (with their stages by rule),
  // the total once, and the stage details folded away. The words of each window and the home tip are written by the model
  // and fill their places when they arrive. Four steps: the first two on a fixed timer, the third when the path has really
  // arrived, the fourth only when the words have really arrived.
  const STEPS = ["p_step1", "p_step2", "p_step3", "p_step4"];
  $("plan").innerHTML = `<ol class="build-steps" id="plan-steps">${STEPS.map((k, i) => `<li id="ps${i}"><span class="mark" aria-hidden="true"></span>${esc(t(k))}</li>`).join("")}</ol><div id="plan-body"></div>`;
  const tick = (i) => $(`ps${i}`).classList.add("done");
  const wait = (ms) => new Promise((res) => setTimeout(res, ms));
  const timed = wait(350).then(() => { tick(0); return wait(450); }).then(() => tick(1));
  const waiting = `<p class="notes-wait"><span class="spinner small" aria-hidden="true"></span> ${esc(I.t("p_notes_wait"))}</p>`;

  let p;
  try {
    const res = await fetch(`/api/results/${encodeURIComponent(id)}/path?lang=${I.lang}`);
    p = await res.json();
    if (!res.ok) throw new Error();
  } catch { p = { status: "unavailable" }; }
  await timed;
  if (p.status !== "ready") {
    $("plan-steps").remove();
    const key = { reached: "p_reached", teacher: "p_teacher" }[p.status] || "p_unavailable";
    $("plan-body").innerHTML = `<p${p.status === "unavailable" ? ' class="note"' : ""}>${esc(t(key))}</p>`;
    return;
  }
  tick(2);
  const byId = new Map(p.stages.map((x) => [x.id, x]));
  const sep = I.lang === "en" ? ", " : "، ";
  const unit = (n) => I.t(n === 1 ? "unit_one" : n === 2 ? "unit_two" : n <= 10 ? "unit_few" : "unit_many");
  const w = p.windows, tot = p.totals;
  // Above each window, short chips with the stage names (and the Tajweed point alongside) — no sentence.
  const chipRow = (k) => (k === "month3" && w.done_by_month3)
    ? `<p class="small muted">${esc(I.t("w_done_by"))}</p>`
    : `<div class="stage-chips">${p.chips[k].map((c) => `<span class="stage-chip">${esc(c)}</span>`).join('<span class="dot" aria-hidden="true">·</span>')}</div>`;
  // The total once, at the chosen rate; with two a week, one sentence on how three a week shortens it.
  const weeksLine = I.t("p_weeks", { weeks: tot.weeks, unit: unit(tot.weeks), rate: I.t(`rate${tot.per_week}`) }) + " "
    + (tot.per_week === 2 ? I.t("p_weeks_less", { weeks: tot.weeks_at[3], unit: unit(tot.weeks_at[3]) })
      : I.t("p_weeks_other", { rate: I.t("rate2"), weeks: tot.weeks_at[2], unit: unit(tot.weeks_at[2]) }));
  $("plan-body").innerHTML = `
    <div class="plan">
      ${["month1", "month3", "longer"].map((k) => `
      <article class="window">
        <h3>${esc(I.t(`w_${k}`))}</h3>
        ${chipRow(k)}
        <div class="window-text" data-window="${k}">${waiting}</div>
      </article>`).join("")}
      <p class="small"><b>${esc(weeksLine)}</b></p>
      <div id="p-tip">${waiting}</div>
      <div id="p-notes-failed" hidden><p class="note">${esc(I.t("p_notes_failed"))}</p><button class="btn secondary" id="p-retry" type="button">${esc(I.t("p_retry"))}</button></div>
      <details class="stage-details">
        <summary>${esc(I.t("p_details"))}</summary>
        ${p.stages.map((st, i) => `
        <article class="plan-stage">
          <h3><span class="n">${i + 1}</span> ${esc(st.name)}</h3>
          <dl>
            <dt>${esc(I.t("p_goals"))}</dt><dd>${esc(st.goals)}</dd>
            <dt>${esc(I.t("p_content"))}</dt><dd>${esc(st.content)}</dd>
            ${st.review ? `<dt>${esc(I.t("p_review"))}</dt><dd>${esc(st.review.join(sep))}</dd>` : ""}
            ${st.focus ? `<dt>${esc(I.t("p_focus"))}</dt><dd>${esc(st.focus)}</dd>` : ""}
            <dt>${esc(I.t("p_exit"))}</dt><dd>${esc(st.exit_sign)}</dd>
            <dt></dt><dd class="small muted">${esc(I.t("p_sessions", { n: st.sessions }))}</dd>
          </dl>
        </article>`).join("")}
      </details>
    </div>`;

  const slots = () => [$("p-tip"), ...document.querySelectorAll(".window-text")];
  async function loadNotes() {
    $("p-notes-failed").hidden = true;
    $("plan-steps").hidden = false;
    $("ps3").classList.remove("done");
    slots().forEach((el) => { el.hidden = false; el.innerHTML = waiting; });
    let n;
    try {
      const res = await fetch(`/api/results/${encodeURIComponent(id)}/notes?lang=${I.lang}`);
      n = await res.json();
      if (!res.ok || n.status !== "ready") throw new Error();
    } catch {
      // The page stays complete without the words; "Try again" asks for the words only.
      slots().forEach((el) => { el.hidden = true; el.innerHTML = ""; });
      $("plan-steps").hidden = true;
      $("p-notes-failed").hidden = false;
      return;
    }
    tick(3);
    document.querySelectorAll(".window-text").forEach((el) => (el.innerHTML = `<p>${esc(n.windows[el.dataset.window])}</p>`));
    $("p-tip").innerHTML = `<p><b>${esc(I.t("p_tip"))}:</b> ${esc(n.tip)}</p>`;
    setTimeout(() => ($("plan-steps").hidden = true), 1500);
  }
  $("plan-body").addEventListener("click", (e) => { if (e.target.id === "p-retry") loadNotes(); });
  loadNotes();
})();
</script>
</body>
</html>
