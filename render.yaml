# Render Blueprint for the Qurana diagnostic (test.quraana-institute.com).
services:
  - type: web
    name: qurana-diagnostic
    runtime: node
    plan: starter            # always on: the free plan sleeps and the first parent waits about a minute
    region: frankfurt
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Results are kept in Supabase Postgres (docs/supabase.sql). Set both in the Render dashboard; never in the code.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Where result links point: the Render address for now (https://<service>.onrender.com),
      # then https://test.quraana-institute.com once the domain is connected. Set it in the Render dashboard.
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SITE_URL
        value: https://quraana-institute.com
      - key: WHATSAPP_NUMBER
        value: "201142847626"
      # An email to info@ for every new result (lib/notify.js), through the info@ mailbox (Namecheap cPanel mail).
      # SMTP_PASS is the mailbox password: set it in the Render dashboard only, never in the code.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        value: info@quraana-institute.com
      - key: SMTP_PASS
        sync: false
      - key: NOTIFY_TO
        value: info@quraana-institute.com
      # Every finished diagnostic is sent to the Quraana website as a lead (lib/leads.js). The shared secret:
      # set it in the Render dashboard only, never in the code.
      - key: DIAGNOSTIC_WEBHOOK_SECRET
        sync: false
      - key: NODE_VERSION
        value: "22"
      # For step 2 (learning plan with Claude). Set in Render, never in the repository.
      - key: ANTHROPIC_API_KEY
        sync: false
      # The PIN for /admin (internal preview before the curriculum is approved). Set it in the Render dashboard; never in the code.
      - key: ADMIN_PIN
        sync: false
